name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build
        env:
          PUBLIC_LEAD_ENDPOINT: ${{ vars.PUBLIC_LEAD_ENDPOINT }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}

      - name: Smoke tests
        run: npm run test:smoke

      - name: Prepare Pages artifact
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: freedive.ee

      - name: Enable GitHub Pages (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api")
          echo "Pages GET status: $status"
          if [ "$status" = "404" ]; then
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$api" \
              --data '{"source":{"branch":"gh-pages","path":"/"}}')
            code=$(echo "$response" | tail -1)
            echo "Pages POST status: $code"
            echo "$response" | head -n -1
            case "$code" in
              2*) echo "Pages enabled from gh-pages branch" ;;
              409) echo "Pages already being created — OK" ;;
              *) echo "::warning::Could not enable Pages via API (status $code). Enable once manually: Settings → Pages → Deploy from branch → gh-pages." ;;
            esac
          fi
